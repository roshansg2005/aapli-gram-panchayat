# ==============================================================================
# 🏛️ AAPLI GRAM PANCHAYAT - PRODUCTION REVERSE PROXY CONFIGURATION (NGINX)
# ==============================================================================

# Rate Limiting Zones (DDoS & Brute Force Mitigation)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=voice_limit:10m rate=5r/s;

# Upstream Backend Cluster
upstream panchayat_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name grampanchayat.maharashtra.gov.in *.grampanchayat.maharashtra.gov.in;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grampanchayat.maharashtra.gov.in *.grampanchayat.maharashtra.gov.in;

    # SSL Certificates (Let's Encrypt / DigiCert)
    ssl_certificate /etc/letsencrypt/live/grampanchayat.maharashtra.gov.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grampanchayat.maharashtra.gov.in/privkey.pem;

    # SSL Protocol & Cipher Hardening (Mozilla Modern standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Max File Upload Size (5 MB for Documents / Proofs)
    client_max_body_size 5M;

    # Frontend Single Page App (SPA) Static Files
    root /var/www/aapli-gram-panchayat/dist;
    index index.html;

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Static Assets Long-Term Cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Direct Mobile APK Download (Self-Hosted, No Play Store Required)
    location /apk/ {
        alias /var/www/aapli-gram-panchayat/dist/apk/;
        add_header Content-Disposition 'attachment; filename="Aapli_Grampanchayat.apk"';
        default_type application/vnd.android.package-archive;
        expires 1d;
    }

    # Backend API Proxy
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://panchayat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Strict Rate Limit for Auth Endpoints (Prevent Brute Force)
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://panchayat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telephony Voice Webhook Proxy
    location /api/voice/ {
        limit_req zone=voice_limit burst=10 nodelay;

        proxy_pass http://panchayat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
